[package]
name = "expense-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "12.0.0", features = ["aws_lc_rs"] }
rand = "0.10.4"
regex = "1.13.2"
reqwest = { version = "0.13.5", features = ["json", "form", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "macros"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time"] }
toml = "1.2.2"
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
utoipa = { version = "6.0.0", features = ["uuid", "chrono"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
validator = { version = "0.21.0", features = ["derive"] }
