sender = "gopay.co.id"
default_type = "debit"
body_regex = '''(?si)(?:membayar|mengirim) Rp\s*(?P<amount>[\d.,]+) ke (?P<merchant>.+?) pakai GoPay.*?Waktu:\s*(?P<date>[^\n]+)'''

[[rule]]
provider = "gopay"
sender = "gopay.co.id"
default_type = "credit"
body_regex = '''(?si)Top up GoPay sebesar Rp\s*(?P<amount>[\d.,]+) dari (?P<merchant>.+?) berhasil.*?Waktu:\s*(?P<date>[^\n]+)'''

[[rule]]
provider = "gopay"
sender = "gopay.co.id"
default_type = "credit"
body_regex = '''(?si)menerima Rp\s*(?P<amount>[\d.,]+) dari (?P<merchant>.+?) di GoPay.*?Waktu:\s*(?P<date>[^\n]+)'''

# ---------- OVO ----------
