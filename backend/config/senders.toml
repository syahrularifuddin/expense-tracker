subject_pattern = '''(?i)^Internet Transaction Journal$'''
search_subject = "Internet Transaction Journal"
default_type = "debit"
priority = 0
category = "Tagihan"
body_regex = '''(?s)Status\n:\n(?:Successful|Berhasil)\n.*?(?:Transaction Date|Tanggal Transaksi)\n:\n(?P<date>[^\n]+)\n.*?(?:Transaction Type|Transfer Type|Jenis Transaksi|Jenis Transfer)\n:\n(?P<merchant>[^\n]+)\n.*?(?:Total Payment|Total Bayar)\n:\n(?P<currency>[A-Z]{3})\s*(?P<amount>[\d.,]+)'''

# ---------- Templat untuk sender tambahan user ----------
# Tidak dipakai saat sinkron; POST /senders menyalin subject_pattern + body_regex ini.
[[rule]]
provider = "generic"
sender = ""
enabled = false
priority = -100
subject_pattern = '''(?i)transaksi|pembayaran|transfer|top.?up|berhasil|dana masuk|debit|kredit|payment|receipt|transaction'''
body_regex = '''(?i)(?:Rp\.?|IDR)\s*(?P<amount>\d[\d.,]*)'''
