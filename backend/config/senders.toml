# Aturan parser global, di-seed ke tabel parser_rules (user_id NULL) setiap backend start.
#
# sender          : potongan alamat From (case-insensitive).
# subject_pattern : regex subjek. Email yang pengirim + subjeknya tidak cocok aturan mana pun
#                   dilewati (promo, OTP, info akun), tidak dicatat sebagai gagal parse.
# search_subject  : frasa untuk query Gmail `subject:"..."` (mempersempit pencarian).
# body_regex      : regex dengan named groups: amount (wajib), merchant, date, type, currency.
#                   Body sudah berupa teks: HTML dibuang, satu baris per blok.
# default_type    : debit | credit, dipakai jika group `type` tidak ada.
# category        : nama kategori default (menang atas kata kunci merchant).
# priority        : besar = dicoba lebih dulu. Aturan pertama yang cocok menang.
# enabled         : false = templat saja (tidak dipakai saat sinkron).
#
# Format di bawah diambil dari email asli (Nov 2026). Contoh anonim ada di fixtures/generate.py.

# ---------- Jenius (kartu kredit) ----------
# Total: "IDR 631,440.00" atau mata uang asing "SGD 1.38".
# Tanggal: "21 NOV 2026 15:25:30 WIB" (kartu) atau "11/11/2026 17:30:36" (QRIS).
[[rule]]
provider = "jenius"
sender = "jenius_noreply@smbci.com"
subject_pattern = '''(?i)^Credit Card (QRIS )?Transaction Notification$'''
search_subject = "Transaction Notification"
default_type = "debit"
body_regex = '''(?s)Merchant:\s*(?P<merchant>[^\n]+?)\s*\nTransaction date & time:\s*(?P<date>[^\n]+)\nTotal:\s*(?P<currency>[A-Z]{3})\s*(?P<amount>[\d.,]+)'''

# Pembatalan / refund: subjek "Your Jenius 437896******1234 transaction has been cancelled".
# Body sama dengan notifikasi transaksi, tetapi "Merchant: Refund"; tanggal dan nominal milik
# transaksi semula. Dicatat sebagai credit sehingga mengurangi estimasi tagihan kartu.
[[rule]]
provider = "jenius"
sender = "jenius_noreply@smbci.com"
subject_pattern = '''(?i)^Your Jenius \S+ transaction has been cancell?ed$'''
search_subject = "transaction has been cancelled"
default_type = "credit"
body_regex = '''(?s)Merchant:\s*(?P<merchant>[^\n]+?)\s*\nTransaction date & time:\s*(?P<date>[^\n]+)\nTotal:\s*(?P<currency>[A-Z]{3})\s*(?P<amount>[\d.,]+)'''

# ---------- Krom ----------
# Tanggal: "21 November 2026, 12.35" (transfer) atau "18-11-2026 11:16 (WIB)" (QRIS).
[[rule]]
provider = "krom"
sender = "noreply@krom.id"
subject_pattern = '''(?i)^Transfer Berhasil$'''
search_subject = "Transfer Berhasil"
default_type = "debit"
category = "Transfer"
body_regex = '''(?s)Tanggal & Waktu:\s*(?P<date>[^\n]+)\n.*?\nKe:\s*(?P<merchant>[^\n•]+?)\s*(?:•|\n).*?\nJumlah:\s*Rp\s*(?P<amount>[\d.,]+)'''

[[rule]]
provider = "krom"
sender = "noreply@krom.id"
subject_pattern = '''(?i)^Transaksi QRIS Berhasil$'''
search_subject = "Transaksi QRIS Berhasil"
default_type = "debit"
body_regex = '''(?s)Tanggal & Waktu:\s*(?P<date>[^\n]+)\n.*?\nMerchant:\s*(?P<merchant>[^\n]+?)\s*\nJumlah:\s*Rp\s*(?P<amount>[\d.,]+)'''

# ---------- BCA (myBCA "Internet Transaction Journal") ----------
# Dua bahasa (Successful/Berhasil, Transaction Date/Tanggal Transaksi, ...). Setiap field
# berbentuk "Label\n:\nNilai". Hanya status Successful/Berhasil yang dicatat; transaksi
# gagal dan email pendaftaran rekening masuk "gagal diproses". Nominal: total yang
# terpotong (termasuk biaya admin) bila email menyebutkannya.

# QRIS
[[rule]]
provider = "bca"
sender = "bca@bca.co.id"
subject_pattern = '''(?i)^Internet Transaction Journal$'''
search_subject = "Internet Transaction Journal"
default_type = "debit"
priority = 10
body_regex = '''(?s)Status\n:\n(?:Successful|Berhasil)\n.*?(?:Transaction Date|Tanggal Transaksi)\n:\n(?P<date>[^\n]+)\n.*?(?:Transaction Type|Transfer Type|Jenis Transaksi|Jenis Transfer)\n:\n(?:QRIS Payment|Pembayaran QRIS)\n.*?(?:Payment to|Pembayaran [Kk]e)\n:\n(?P<merchant>[^\n]+)\n.*?(?:Total Payment|Total Bayar)\n:\n(?P<currency>[A-Z]{3})\s*(?P<amount>[\d.,]+)'''

# Virtual Account: merchant = nama perusahaan/produk
[[rule]]
provider = "bca"
sender = "bca@bca.co.id"
subject_pattern = '''(?i)^Internet Transaction Journal$'''
search_subject = "Internet Transaction Journal"
default_type = "debit"
priority = 10
body_regex = '''(?s)Status\n:\n(?:Successful|Berhasil)\n.*?(?:Transaction Date|Tanggal Transaksi)\n:\n(?P<date>[^\n]+)\n.*?(?:Transaction Type|Transfer Type|Jenis Transaksi|Jenis Transfer)\n:\n(?:Transfer to|Transfer ke) BCA Virtual Account\n.*?(?:Company/Product Name|Nama Perusahaan/Produk)\n:\n(?P<merchant>[^\n]+)\n(?:.*?(?:Total Payment|Total Bayar)|.*?(?:Bill Total|Total Tagihan|Nominal Bayar))\n:\n(?P<currency>[A-Z]{3})\s*(?P<amount>[\d.,]+)'''

# Transfer QRIS (ke merchant/e-wallet lewat QRIS)
[[rule]]
provider = "bca"
sender = "bca@bca.co.id"
subject_pattern = '''(?i)^Internet Transaction Journal$'''
search_subject = "Internet Transaction Journal"
default_type = "debit"
priority = 10
body_regex = '''(?s)Status\n:\n(?:Successful|Berhasil)\n.*?(?:Transaction Date|Tanggal Transaksi)\n:\n(?P<date>[^\n]+)\n.*?(?:Transaction Type|Transfer Type|Jenis Transaksi|Jenis Transfer)\n:\n(?:Transfer QRIS|QRIS Transfer)\n.*?(?:Nama Penerima|Beneficiary Name)\n:\n(?P<merchant>[^\n]+)\n(?:.*?Total Transfer|.*?Nominal)\n:\n(?P<currency>[A-Z]{3})\s*(?P<amount>[\d.,]+)'''

