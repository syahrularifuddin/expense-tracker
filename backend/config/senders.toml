# Daftar sender + aturan parser global. Di-seed ke tabel parser_rules (user_id NULL).
#
# sender          : potongan alamat From (case-insensitive). Kosong = semua sender.
# subject_pattern : regex opsional untuk subject.
# body_regex      : regex dengan named groups: amount (wajib), merchant, date, type.
# default_type    : debit | credit, dipakai jika group `type` tidak ada.
# priority        : besar = dicoba lebih dulu. Aturan pertama yang cocok menang.
#
# PERHATIAN: domain sender dan template di bawah adalah perkiraan, belum
# dicocokkan dengan email asli. Sesuaikan regex setelah melihat email sungguhan
# (lihat tabel unparsed_emails).

# ---------- BCA ----------
[[rule]]
provider = "bca"
sender = "bca.co.id"
default_type = "debit"
body_regex = '''(?si)Tanggal Transaksi\s*:\s*(?P<date>[^\n]+)\n.*?Merchant\s*:\s*(?P<merchant>[^\n]+?)\s*\n.*?Jumlah\s*:\s*Rp\s*(?P<amount>[\d.,]+)'''

[[rule]]
provider = "bca"
sender = "bca.co.id"
default_type = "debit"
body_regex = '''(?si)Tanggal\s*:\s*(?P<date>[^\n]+)\n.*?Penerima\s*:\s*(?P<merchant>[^\n]+?)\s*\n.*?Nominal\s*:\s*Rp\s*(?P<amount>[\d.,]+)'''

[[rule]]
provider = "bca"
sender = "bca.co.id"
default_type = "credit"
body_regex = '''(?si)Tanggal\s*:\s*(?P<date>[^\n]+)\n.*?Pengirim\s*:\s*(?P<merchant>[^\n]+?)\s*\n.*?Nominal\s*:\s*Rp\s*(?P<amount>[\d.,]+)'''

# ---------- Mandiri (Livin') ----------
[[rule]]
provider = "mandiri"
sender = "bankmandiri.co.id"
default_type = "debit"
body_regex = '''(?si)Penerima\s*\n\s*(?P<merchant>[^\n]+?)\s*\n.*?Tanggal\s*\n\s*(?P<date>[^\n]+\n\s*Jam\s*\n\s*[^\n]+)\n.*?Nominal Transaksi\s*\n\s*Rp\s*(?P<amount>[\d.,]+)'''

[[rule]]
provider = "mandiri"
sender = "bankmandiri.co.id"
default_type = "credit"
body_regex = '''(?si)Pengirim\s*\n\s*(?P<merchant>[^\n]+?)\s*\n.*?Tanggal\s*\n\s*(?P<date>[^\n]+\n\s*Jam\s*\n\s*[^\n]+)\n.*?Nominal Transaksi\s*\n\s*Rp\s*(?P<amount>[\d.,]+)'''

