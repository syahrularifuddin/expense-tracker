body_regex = '''(?si)Top Up saldo DANA sebesar Rp\s*(?P<amount>[\d.,]+) melalui (?P<merchant>.+?) berhasil.*?Tanggal:\s*(?P<date>[^\n]+)'''

# ---------- ShopeePay ----------
[[rule]]
provider = "shopeepay"
sender = "shopee.co.id"
default_type = "debit"
body_regex = '''(?si)Merchant:\s*(?P<merchant>[^\n]+?)\s*\n.*?Total Pembayaran:\s*Rp\s*(?P<amount>[\d.,]+).*?Waktu Transaksi:\s*(?P<date>[^\n]+)'''

[[rule]]
provider = "shopeepay"
sender = "shopee.co.id"
default_type = "credit"
body_regex = '''(?si)Isi Saldo.*?Metode:\s*(?P<merchant>[^\n]+?)\s*\n.*?Jumlah:\s*Rp\s*(?P<amount>[\d.,]+).*?Waktu Transaksi:\s*(?P<date>[^\n]+)'''

[[rule]]
provider = "shopeepay"
sender = "shopee.co.id"
default_type = "credit"
body_regex = '''(?si)Pengembalian Dana.*?Merchant:\s*(?P<merchant>[^\n]+?)\s*\n.*?Jumlah Pengembalian:\s*Rp\s*(?P<amount>[\d.,]+).*?Waktu Transaksi:\s*(?P<date>[^\n]+)'''

# ---------- Fallback generik ----------
# Tanpa merchant dan tanggal; type ditebak dari kata kunci subject + body.
[[rule]]
provider = "generic"
sender = ""
priority = -100
subject_pattern = '''(?i)transaksi|pembayaran|transfer|top.?up|berhasil|dana masuk|debit|kredit|payment|receipt'''
body_regex = '''(?i)(?:Rp\.?|IDR)\s*(?P<amount>\d[\d.,]*)'''
