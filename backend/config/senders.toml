body_regex = '''(?si)Tanggal:\s*(?P<date>[^\n]+)\n.*?Sumber:\s*(?P<merchant>[^\n]+?)\s*\n.*?Nominal:\s*Rp\s*(?P<amount>[\d.,]+)'''

# ---------- Jenius ----------
[[rule]]
provider = "jenius"
sender = "jenius.com"
default_type = "debit"
body_regex = '''(?si)Kartu Debit Jenius di (?P<merchant>.+?) sebesar Rp\s*(?P<amount>[\d.,]+) pada (?P<date>[^\n]+)'''

[[rule]]
provider = "jenius"
sender = "jenius.com"
default_type = "debit"
body_regex = '''(?si)mengirim uang sebesar Rp\s*(?P<amount>[\d.,]+) ke (?P<merchant>.+?) pada (?P<date>[^\n]+)'''

[[rule]]
provider = "jenius"
sender = "jenius.com"
default_type = "credit"
body_regex = '''(?si)menerima uang sebesar Rp\s*(?P<amount>[\d.,]+) dari (?P<merchant>.+?) pada (?P<date>[^\n]+)'''

# ---------- GoPay ----------
